<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hogwarts · A Magical Life</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Marck+Script&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#070c17;color:#f7e6bf;font-family:Georgia,serif}.scene{position:relative;width:100%;height:100vh;overflow:hidden;background:#081020}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hotspot{position:absolute;background:transparent;border:0;cursor:pointer;z-index:2}.hotspot:hover{outline:2px solid #e7c17e88;outline-offset:1px;border-radius:12px;background:#e7c17e0e}.new{left:2.5%;top:13%;width:14.5%;height:6.5%}.load{left:2.5%;top:20%;width:14.5%;height:6.5%}.settings{left:2.5%;top:27%;width:14.5%;height:6.5%}.credits{left:2.5%;top:34%;width:14.5%;height:6.5%}.begin{left:35%;top:65%;width:30%;height:8.5%}.owl{right:1%;top:0;width:24%;height:27%}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:#03050cba;backdrop-filter:blur(9px);padding:18px}.modal.open{display:flex}.box{position:relative;width:min(620px,100%);max-height:90vh;overflow:auto;background:linear-gradient(135deg,#f5e7c4,#dfc395);color:#352418;padding:clamp(25px,5vw,55px);border:8px double #8c683e;box-shadow:0 25px 110px #000;text-align:center;animation:appear .6s ease}.box.letter-mode{width:min(540px,100%);background:radial-gradient(ellipse at 35% 25%,#f5ebd4 0%,#eadfc5 62%,#d9c7a7 100%);border:0;border-radius:1px;padding:clamp(28px,5vw,54px);box-shadow:0 22px 100px #000c,inset 0 0 35px #80634027;text-align:left}.letter-mode .letterbody{font-family:'Marck Script','Brush Script MT',cursive;color:#30251d}.letter-mode .letterbody p{font-family:inherit;font-size:clamp(19px,2.7vw,24px);line-height:1.28;margin:15px 0;text-align:left}.letter-mode .letterbody .letterheading{text-align:center;font:600 14px Georgia,serif;letter-spacing:.12em;margin-bottom:15px}.letter-mode .letterbody .lettercrest{text-align:center;font:55px Georgia,serif;line-height:1;color:#332820}.letter-mode .letterbody .lettercrest small{display:block;font:10px Georgia,serif;letter-spacing:.22em;margin-top:4px}.letter-mode .letterbody .letteraddress{margin:22px 0 20px 15px;font-size:21px;line-height:1.12}.letter-mode .letterbody .signature{font-family:'Great Vibes',cursive;font-size:clamp(42px,7vw,59px);margin:0}.letter-mode .letterbody .letterfoot{font:11px Georgia,serif;letter-spacing:.03em;margin-top:0}.letter-mode .letterbody .continue-row{text-align:center;margin-top:20px}.letter-mode .letterbody .continue-row .btn{font-family:Cinzel,serif}.box h2{font:600 clamp(20px,4vw,34px) Cinzel,serif;margin:10px 0}.box p{font-size:19px;line-height:1.6;text-align:left}.box .signature{font:48px 'Great Vibes',cursive;text-align:left;margin:0}.crest{font:44px Cinzel,serif}.btn{border:1px solid #b89150;background:#281b1b;color:#f5dca9;padding:13px 22px;font:13px Cinzel,serif;letter-spacing:.08em;cursor:pointer;margin:8px}.btn:hover{background:#49301d}.close{position:absolute;top:6px;right:9px;border:0;background:none;font-size:25px;color:#4d3322;cursor:pointer}input{padding:13px;border:1px solid #947344;background:#fff8e9;font:18px Georgia,serif;width:100%;max-width:340px}.nameform{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0}.nameform .btn{margin:0}.hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:3;color:#f4e3c6;font:12px Cinzel,serif;text-align:center;text-shadow:0 2px 7px #000;background:#0b1423b8;padding:8px 14px;border-radius:30px;pointer-events:none}.fog{position:absolute;bottom:-10%;left:-15%;width:130%;height:20%;background:#d2dce522;filter:blur(35px);animation:fog 12s ease-in-out infinite alternate;pointer-events:none}.particle{position:fixed;width:4px;height:4px;background:#ffe5a3;border-radius:50%;box-shadow:0 0 10px #ffdf86;pointer-events:none;z-index:5;animation:fade .8s forwards}@keyframes fog{to{transform:translateX(8%)}}@keyframes fade{to{opacity:0;transform:translateY(-22px)}}@keyframes appear{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@media(max-width:720px){.art{object-fit:contain;background:#060b16}.hotspot{display:none}.mobile{display:flex!important}.hint{bottom:85px}.scene{height:calc(100dvh - 80px)}.box p{font-size:17px}}.mobile{display:none;position:fixed;bottom:0;left:0;right:0;z-index:5;justify-content:center;gap:5px;background:#080e19;padding:12px;flex-wrap:wrap}.mobile button{font:10px Cinzel,serif;padding:9px;color:#e8d1a0;background:#19263a;border:1px solid #947444}
/* Interactive cinematic Great Hall */
#hallView{display:none;position:fixed;inset:0;z-index:6;background:#090a12;overflow:hidden}
#hallView.active{display:block}
.hall-art{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hall-ui-mask{position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(0deg,#08080b 0%,#08080bef 68%,transparent 100%)}
.hall-topmask{position:absolute;top:0;left:0;right:0;height:8%;background:#09090bd9}
.hall-nav{position:absolute;top:13px;left:18px;right:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;z-index:2;font:13px Cinzel,serif}
.hall-nav button{background:#111017e6;color:#e9ca8c;border:1px solid #b78d4c;padding:10px 16px;cursor:pointer}
.hall-content{position:absolute;bottom:3%;left:4%;right:4%;z-index:2;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:end}
.hall-dialogue{background:linear-gradient(120deg,#f0d9a8,#c9a26b);border:4px double #9d743d;box-shadow:0 10px 40px #000b;padding:22px 28px;color:#2d1d16;min-height:200px}
.hall-dialogue .speaker{font:600 16px Cinzel,serif;margin-bottom:9px}
.hall-dialogue p{font:clamp(20px,2.1vw,28px) 'Marck Script',cursive;line-height:1.25;margin:0}
.hall-choices{display:grid;gap:8px;max-height:38vh;overflow:auto}
.hall-choices button{font:clamp(13px,1.3vw,17px) Georgia,serif;color:#f2d7a2;background:linear-gradient(90deg,#090a0deb,#2b1c16ed);border:1px solid #ac854e;padding:13px 18px;text-align:left;cursor:pointer;transition:.2s}
.hall-choices button:hover,.hall-choices button:focus{background:#59402a;transform:translateX(-4px)}
.hall-choices button:disabled{opacity:.45}
.hall-tag{font:11px Cinzel,serif;letter-spacing:.16em;color:#f0d6a0;text-shadow:0 2px 6px #000}
.hall-burst{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;background:radial-gradient(ellipse at 50% 48%,var(--house-glow,#f2d38a99),transparent 65%);transition:opacity 1s}
.hall-burst.show{opacity:1}
.hall-candle{position:absolute;z-index:1;width:3px;height:12px;background:#ffe0a2;box-shadow:0 0 12px 5px #fbbf6caa;animation:floatHall 3s ease-in-out infinite alternate;pointer-events:none}
@keyframes floatHall{to{transform:translateY(-14px);opacity:.55}}
@media(max-width:700px){.hall-art{object-fit:cover;object-position:center}.hall-ui-mask{height:62%}.hall-content{display:block;bottom:2%;left:3%;right:3%}.hall-dialogue{min-height:0;padding:13px 15px;margin-bottom:8px}.hall-dialogue p{font-size:20px}.hall-choices{max-height:34vh;gap:5px}.hall-choices button{padding:9px 12px;font-size:14px}.hall-topmask{height:9%}.hall-nav{font-size:10px}}
</style></head><body><main class="scene"><img class="art" src="castle.png" alt="Cinematic Hogwarts-inspired castle above a misty lake at night, with an owl carrying a letter"><div class="fog"></div><button aria-label="New game" class="hotspot new" onclick="newGame()"></button><button aria-label="Load game" class="hotspot load" onclick="loadGame()"></button><button aria-label="Settings" class="hotspot settings" onclick="show('settings')"></button><button aria-label="Credits" class="hotspot credits" onclick="show('credits')"></button><button aria-label="Begin your journey" class="hotspot begin" onclick="newGame()"></button><button aria-label="Open owl letter" class="hotspot owl" onclick="newGame()"></button></main><section id="hallView" aria-label="Great Hall Sorting Ceremony"><img class="hall-art" src="great-hall.png" alt="Cinematic Great Hall with floating candles, long tables and the Sorting Hat"><div class="hall-topmask"></div><div class="hall-ui-mask"></div><div class="hall-burst" id="hallBurst"></div><div id="hallCandles"></div><div class="hall-nav"><button onclick="returnCastle()">← Castle</button><span class="hall-tag">THE SORTING CEREMONY</span><button onclick="restartSorting()">↺ Restart sorting</button></div><div class="hall-content"><div class="hall-dialogue"><div class="speaker" id="hallSpeaker">The Sorting Hat</div><p id="hallText"></p></div><div class="hall-choices" id="hallChoices"></div></div></section><div class="hint">✦ Click Begin Your Journey, New Game, or the owl ✦</div><nav class="mobile"><button onclick="newGame()">New game</button><button onclick="loadGame()">Load game</button><button onclick="show('settings')">Settings</button><button onclick="show('credits')">Credits</button></nav><section class="modal" id="modal" role="dialog" aria-modal="true"><div class="box"><button class="close" aria-label="Close" onclick="hide()">×</button><div id="content"></div></div></section><script>const KEY='hogwarts-cinematic-v1';const modal=document.getElementById('modal'),content=document.getElementById('content');function show(type){document.querySelector('.box').classList.remove('letter-mode');modal.classList.add('open');if(type==='settings')content.innerHTML='<h2>Magical Settings</h2><p>This is our cinematic opening prototype. Animated fog and magical cursor sparks are enabled.</p><button class="btn" onclick="hide()">Return to Hogwarts</button>';if(type==='credits')content.innerHTML='<h2>About This Adventure</h2><p>An unofficial fan-made Hogwarts-inspired experience. This first cinematic prototype uses original generated artwork. More interactive scenes are planned.</p><button class="btn" onclick="hide()">Return to Hogwarts</button>'}function hide(){modal.classList.remove('open');document.querySelector('.box').classList.remove('letter-mode')}function newGame(){document.querySelector('.box').classList.remove('letter-mode');modal.classList.add('open');content.innerHTML='<div class="crest">⚜ H ⚜</div><h2>A Letter for You</h2><p style="text-align:center">A snowy owl has delivered an envelope, sealed in crimson wax. To whom is this letter addressed?</p><form class="nameform" onsubmit="accept(event)"><input id="name" maxlength="45" placeholder="Your name" required aria-label="Your name"><button class="btn">Open my letter</button></form>'}function accept(e){e.preventDefault();const name=document.getElementById('name').value.trim();if(!name)return;localStorage.setItem(KEY,JSON.stringify({name,stage:'letter'}));letter(name)}function letter(name){modal.classList.add('open');document.querySelector('.box').classList.add('letter-mode');content.innerHTML=`<div class="letterbody"><div class="lettercrest">♜<small>HOGWARTS</small></div><div class="letterheading">HOGWARTS SCHOOL OF<br>WITCHCRAFT AND WIZARDRY</div><div class="letteraddress">To: <span id="studentAddress"></span><br>The Room Beneath the Stars<br>The Muggle World</div><p>Dear <span id="student"></span>,</p><p>We are pleased to inform you that you have been accepted at Hogwarts School of Witchcraft and Wizardry.</p><p>Students are requested to prepare their belongings for the coming term. Details of your magical journey will be delivered in due course.</p><p>We very much look forward to welcoming you to a new generation of Hogwarts students.</p><p>Yours sincerely,</p><div class="signature">Albus Dumbledore</div><div class="letterfoot">Headmaster · Hogwarts School of Witchcraft and Wizardry</div><div class="continue-row"><button class="btn" onclick="next()">Continue my adventure ✦</button></div></div>`;document.getElementById('student').textContent=name;document.getElementById('studentAddress').textContent=name}
function loadGame(){let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{}if(s?.name){if(s.stage==='hall'||s.stage==='sorted')enterHall();else letter(s.name)}else newGame()}function next(){hide();enterHall()}document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});document.addEventListener('pointermove',e=>{if(Math.random()>.16)return;let p=document.createElement('div');p.className='particle';p.style.left=e.clientX+'px';p.style.top=e.clientY+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),800)})
const HOUSES=['Gryffindor','Ravenclaw','Hufflepuff','Slytherin'];
const HALL_QUESTIONS=[
 {q:'Ah, a new student! Tell me, what calls to your heart most strongly?',options:[['A daring adventure','Gryffindor'],['A mystery waiting to be solved','Ravenclaw'],['A chance to help someone','Hufflepuff'],['An opportunity to achieve greatness','Slytherin']]},
 {q:'A friend is accused of something they did not do. What is your first instinct?',options:[['Stand up and defend them','Gryffindor'],['Find proof of the truth','Ravenclaw'],['Stay beside them no matter what','Hufflepuff'],['Find the cleverest way to clear their name','Slytherin']]},
 {q:'You discover an enchanted book. What do you hope is written inside?',options:[['Tales of legendary heroes','Gryffindor'],['Knowledge lost to the ages','Ravenclaw'],['Magic that heals and protects','Hufflepuff'],['Secrets of extraordinary power','Slytherin']]},
 {q:'One last question. Which quality would you most like to grow?',options:[['Courage','Gryffindor'],['Wisdom','Ravenclaw'],['Patience and kindness','Hufflepuff'],['Determination','Slytherin']]}
];
let hallState=null;
function getSave(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}
function saveHall(){let s=getSave();s.stage=hallState.house?'sorted':'hall';s.sorting=hallState;localStorage.setItem(KEY,JSON.stringify(s))}
function enterHall(){hide();document.getElementById('hallView').classList.add('active');const s=getSave();hallState=s.sorting||{step:0,scores:{Gryffindor:0,Ravenclaw:0,Hufflepuff:0,Slytherin:0},preference:null,house:null};saveHall();renderHall()}
function returnCastle(){document.getElementById('hallView').classList.remove('active')}
function restartSorting(){if(!confirm('Begin the Sorting Ceremony again?'))return;hallState={step:0,scores:{Gryffindor:0,Ravenclaw:0,Hufflepuff:0,Slytherin:0},preference:null,house:null};saveHall();renderHall()}
function hallOptions(options){let box=document.getElementById('hallChoices');box.replaceChildren();for(const [label,callback] of options){let b=document.createElement('button');b.textContent=label;b.onclick=callback;box.appendChild(b)}}
function renderHall(){const s=getSave();document.getElementById('hallBurst').classList.toggle('show',!!hallState.house);if(hallState.house){const colors={Gryffindor:'#ad2d34a8',Ravenclaw:'#4479b6a8',Hufflepuff:'#d9b341a8',Slytherin:'#327c59a8'};document.getElementById('hallBurst').style.setProperty('--house-glow',colors[hallState.house]);document.getElementById('hallSpeaker').textContent='The Sorting Hat';document.getElementById('hallText').textContent=`${s.name||'Young wizard'}, I have considered your heart and your wishes. Better be... ${hallState.house.toUpperCase()}!`;hallOptions([['✦ Return to Hogwarts Castle',returnCastle],['↺ Experience the ceremony again',restartSorting]]);return}
 if(hallState.step<HALL_QUESTIONS.length){let q=HALL_QUESTIONS[hallState.step];document.getElementById('hallSpeaker').textContent=`The Sorting Hat · ${hallState.step+1} / ${HALL_QUESTIONS.length}`;document.getElementById('hallText').textContent=q.q;hallOptions(q.options.map(([label,house])=>[label,()=>{hallState.scores[house]+=2;hallState.step++;saveHall();renderHall()}]));return}
 document.getElementById('hallSpeaker').textContent='The Sorting Hat · Your wishes matter';document.getElementById('hallText').textContent='Hmm... I see many possibilities. But tell me, is there a house you wish to call home? I shall take your choice into account.';hallOptions([...HOUSES.map(h=>[h,()=>finishHall(h)]),['Let the Hat decide',()=>finishHall(null)]]);
}
function finishHall(pref){hallState.preference=pref;let scores={...hallState.scores};if(pref)scores[pref]+=5;hallState.house=HOUSES.slice().sort((a,b)=>scores[b]-scores[a])[0];saveHall();renderHall()}
for(let i=0;i<16;i++){const c=document.createElement('span');c.className='hall-candle';c.style.left=(8+Math.random()*84)+'%';c.style.top=(9+Math.random()*43)+'%';c.style.animationDelay=(-Math.random()*3)+'s';document.getElementById('hallCandles').appendChild(c)}
</script></body></html>
